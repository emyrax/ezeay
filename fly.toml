app = "ezeay-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.checks]
    interval = "30s"
    timeout = "3s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "uploads"
  destination = "/app/server/uploads"