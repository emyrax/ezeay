app = "yuinx"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Apply committed Drizzle migrations before machines boot / health checks run.
  # Needs NEON_DATABASE_URL as a Fly secret; a failure aborts the deploy and keeps
  # the previous release running.
  release_command = "npm run db:migrate"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # Testing stage: keep the machine warm so testers don't hit cold starts.
  # Re-enable autostop when idle cost matters.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "uploads"
  destination = "/app/server/uploads"